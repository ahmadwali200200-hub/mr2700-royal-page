<title>MR. 2700 | Royal Digital World</title>
<style>
:root{--gold:#e5c36a;--gold2:#a77a22;--black:#080808}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f8edce;background:
radial-gradient(ellipse at top,#292014 0%,#0a0a0a 48%,#030303 100%);
font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:24px}
.frame{width:min(100%,520px);border:1px solid var(--gold2);outline:1px solid #59451e;outline-offset:6px;padding:34px 22px 26px;text-align:center;position:relative;box-shadow:0 0 38px #c39a3520,inset 0 0 30px #c39a3510}
.frame:before,.frame:after{content:"✦";position:absolute;color:var(--gold);font-size:20px;top:9px}
.frame:before{left:12px}.frame:after{right:12px}
.crown{font-size:60px;line-height:1;color:var(--gold);text-shadow:0 0 22px #d4ad4e55}
h1{font-size:clamp(32px,8vw,48px);letter-spacing:.16em;margin:16px 0 8px;color:var(--gold);text-shadow:0 2px 18px #d2a54433}
.subtitle{font-size:11px;letter-spacing:.24em;color:#c6ab65;margin-bottom:22px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:18px 0 24px}
.links{display:grid;gap:12px}
a.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:#f5e6b7;border:1px solid #7f6229;background:linear-gradient(110deg,#18140d,#080808);padding:15px 17px;min-height:58px;transition:.2s}
a.link:hover,a.link:focus{border-color:var(--gold);background:#211a0c;transform:translateY(-1px)}
.symbol{width:28px;color:var(--gold);font-size:21px}
.label{text-align:left;font-size:16px;letter-spacing:.04em}
.arrow{margin-left:auto;color:var(--gold);font-size:20px}
footer{margin-top:25px;color:#a99154;font-size:10px;letter-spacing:.16em;line-height:1.8}
.small{color:#8e815f;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<main class="frame">
  <div class="crown" aria-label="Royal crown">♛</div>
  <h1>MR. 2700</h1>
  <div class="subtitle">THE ROYAL DIGITAL WORLD</div>
  <div class="rule"></div>
  <nav class="links" aria-label="Official links">

    <a class="link" href="https://www.youtube.com/@ahmadeshaqzai-w8t9o" target="_blank" rel="noopener noreferrer"><span class="symbol">▶</span><span class="label">YouTube</span><span class="arrow">›</span></a>

    <a class="link" href="mailto:ahmadwali200200@gmail.com"><span class="symbol">✉</span><span class="label">Email</span><span class="arrow">›</span></a>
  </nav>
  <div class="rule"></div>
  <footer>ONE CROWN · ONE BRAND · ALL LINKS<br>GLOBAL MINDSET · BETTER FUTURE · FREEDOM</footer>
  <div class="small">Official links for MR. 2700</div>
</main>

</html>
